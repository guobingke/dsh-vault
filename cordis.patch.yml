# dsh-vault bundle patch: inserts this plugin into a profile's layer stack.
#
# The same patch works for every profile that lists this package in
# `dsh.profile.bundles`. Install once per surface you use:
#
#   # Browser / `dsh web`
#   dsh plugin --profile web add dsh-vault
#
#   # DeepSeek Harness Desktop (reserved profile; use Desktop's bundled dsh
#   # after quitting the app, or install from Desktop → Plugins)
#   dsh plugin --profile desktop add dsh-vault
#
#   # Local checkout
#   dsh plugin --profile web add link:<absolute-path-to-this-repo>
#   dsh plugin --profile desktop add link:<absolute-path-to-this-repo>
#
# The browser half declares `dsh.client.platform: web`, which Desktop also
# loads (Desktop embeds the shared Web UI). Settings → 大肥鱼备份 registers via
# `settings.section`.
- insert:
    - id: dsh-vault
      name: 'dsh-vault'
